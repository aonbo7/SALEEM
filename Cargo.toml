[workspace]
resolver = "2"
members = [
    "crates/saleem_core",
    "crates/saleem_disk_engine",
    "crates/saleem_cleanup_engine",
    "crates/saleem_sentinel",
    "crates/saleem_quarantine",
    "crates/saleem_inventory",
    "crates/saleem_memory_engine",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["SALEEM Contributors"]
repository = "https://github.com/saleem-project/SALEEM"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
rayon = "1.10"
walkdir = "2.5"
goblin = "0.9"
libloading = "0.8"
tempfile = "3.13"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
